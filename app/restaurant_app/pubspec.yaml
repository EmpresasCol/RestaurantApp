name: restaurant_app
description: Qpro - App móvil para meseros
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  provider: ^6.1.1
  http: ^1.1.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  
  # Firebase para notificaciones
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # Vibración y sonido
  audioplayers: ^5.2.1

  # Splash screen e iconos
  flutter_native_splash: ^2.3.5
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  
flutter_native_splash:
  color: "#3F291A"  # Fondo marrón oscuro
  image: assets/splash/logo.png
  android: true
  ios: false
  android_12:
    color: "#3F291A"
    image: assets/splash/logo.png