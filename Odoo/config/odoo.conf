[options]
; === Conexión a PostgreSQL ===
; Estos valores los pasamos por entorno desde docker-compose,
; pero los repetimos aquí explícitamente para claridad.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_dev_2026

; === Carpetas de módulos ===
; Odoo buscará módulos en estas dos rutas:
; - /usr/lib/python3/dist-packages/odoo/addons (los nativos, vienen con la imagen)
; - /mnt/extra-addons (los TUYOS, mapeados desde ./addons en tu máquina)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; === Master password ===
; Protege la creación/eliminación de bases de datos desde el panel admin.
admin_passwd = qpro_admin_dev_2026

; === Logs ===
log_level = info

; === Modo desarrollo ===
; Sin workers para que los cambios se recarguen más fácil en dev.
workers = 0