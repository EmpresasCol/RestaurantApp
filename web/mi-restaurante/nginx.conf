server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Límite de subida de archivos (imágenes de platillos, etc.)
    client_max_body_size 25M;

    # Compresión Gzip para optimizar transferencia
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Raíz de los archivos estáticos de React
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Reverse proxy para la API backend (.NET)
    # Permite comunicación sin problemas de CORS
    location /api/ {
        proxy_pass http://restaurant-api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Reverse proxy para Swagger UI
    location /swagger/ {
        proxy_pass http://restaurant-api:5000/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de activos estáticos generados por Webpack (con hash)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Manejo de rutas SPA de React (evita 404 en refresh)
    location / {
        try_files $uri $uri/ /index.html;
        # Evitar cache de index.html para que los clientes siempre carguen la última versión
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Página de error personalizada
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
