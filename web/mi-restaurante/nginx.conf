server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cabeceras de seguridad. Ninguna location usa add_header: en nginx, un add_header dentro de
    # una location descarta todos los del server. La caché se controla con "expires".
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=()" always;
    # El filtro XSS de los navegadores viejos se apaga: la protección real es la CSP.
    add_header X-XSS-Protection "0" always;
    # Complementa la CSP del <meta> de index.html con lo que un <meta> no puede fijar.
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # La API y su tiempo real (SignalR por WebSocket) detrás del mismo origen: REACT_APP_API_URL=/api.
    location /api/ {
        proxy_pass http://restaurant-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /static/ {
        expires max;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
